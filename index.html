<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Black Hole Simulator</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="styles/ui.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    body { position: fixed; inset: 0; }

    #gl {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      image-rendering: auto;
      background: #000;
    }

    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      pointer-events: none;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.85), 0 1px 2px rgba(0, 0, 0, 0.85);
      letter-spacing: 0.02em;
      white-space: pre;
    }

    #ui {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="hud">FPS: -- | Frame: --</div>
  <div id="ui"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
